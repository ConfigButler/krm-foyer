# Versions, and the published image and Helm chart.
#
# On every push to main, release-please keeps a release pull request up to date from the
# conventional-commit messages: `fix:` is a patch, and `feat:` and `feat!:` are both a minor
# while the version is below 1.0 (`bump-minor-pre-major`). The first release is 0.1.0
# (`initial-version`; without it release-please starts at 1.0.0). Nothing moves to 1.0 on
# its own: that is a deliberate `release-as` once other people use krm-foyer happily.
# Merging that pull request creates the tag and GitHub release. The image is then published only after the full CI workflow has passed
# on that exact commit.
#
# Repository setting required: Settings -> Actions -> General -> "Allow GitHub Actions to
# create and approve pull requests", or release-please cannot open its pull request.
#
# A pull request opened with GITHUB_TOKEN does not trigger other workflows, so CI does not
# run on the release pull request itself. That is acceptable because it only changes the
# changelog and the manifest, and the ci job below validates the merged commit before anything
# is published.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a release halfway through publishing; a following push queues.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read

  image:
    name: publish the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [release-please, ci]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing of the build provenance
      attestations: write
    env:
      IMAGE: ghcr.io/configbutler/krm-foyer
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: VERSION=v${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The Helm chart, as an OCI artifact beside the image, as gitops-reverser publishes its
  # own: helm install krm-foyer oci://ghcr.io/configbutler/charts/krm-foyer --version X.
  # After the image, because the chart's default image tag is its appVersion: a chart is
  # never published before the image it points at. Helm comes from the CI image, like
  # every other tool; it is the same artifact the ci job built for this commit.
  chart:
    name: publish the Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [release-please, ci, image]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing of the build provenance
      attestations: write
    env:
      CHART: ghcr.io/configbutler/charts/krm-foyer
      VERSION: ${{ needs.release-please.outputs.version }}
      CI_IMAGE: krm-foyer-ci:local
      CI_WORKDIR: /workspaces/krm-foyer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download CI image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-image
          path: ${{ runner.temp }}
      - name: Load CI image
        run: docker load -i "$RUNNER_TEMP/ci-image.tar" && rm -f "$RUNNER_TEMP/ci-image.tar"
      # release-please sets the chart's version and appVersion in the release pull request
      # (release-please-config.json); a chart that disagrees with the tag is not pushed.
      - id: push
        name: package and push the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:$CI_WORKDIR" -w "$CI_WORKDIR" \
            -e GITHUB_TOKEN -e GITHUB_ACTOR -e VERSION -e CHART "$CI_IMAGE" bash -lc '
              set -euo pipefail
              chart="$(helm show chart charts/krm-foyer)"
              for field in version appVersion; do
                grep -qx "$field: $VERSION" <<<"$chart" \
                  || { echo "charts/krm-foyer/Chart.yaml: $field is not $VERSION" >&2; exit 1; }
              done
              helm package charts/krm-foyer -d /tmp/chart
              echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
              helm push "/tmp/chart/krm-foyer-$VERSION.tgz" "oci://${CHART%/*}"
            ' 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest="$(awk '/^Digest:/ { print $2 }' "$RUNNER_TEMP/push.log")"
          [ -n "$digest" ] || { echo "no digest in helm push's output" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CHART }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
