# Versions and the published image.
#
# On every push to main, release-please keeps a release pull request up to date from the
# conventional-commit messages: `fix:` is a patch, and `feat:` and `feat!:` are both a minor
# while the version is below 1.0 (`bump-minor-pre-major`). The first release is 0.1.0
# (`initial-version`; without it release-please starts at 1.0.0). Nothing moves to 1.0 on
# its own: that is a deliberate `release-as` once other people use krm-foyer happily.
# Merging that pull request creates the tag and GitHub release. The image is then published only after the full CI workflow has passed
# on that exact commit.
#
# Repository setting required: Settings -> Actions -> General -> "Allow GitHub Actions to
# create and approve pull requests", or release-please cannot open its pull request.
#
# A pull request opened with GITHUB_TOKEN does not trigger other workflows, so CI does not
# run on the release pull request itself. That is acceptable because it only changes the
# changelog and the manifest, and the ci job below validates the merged commit before anything
# is published.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a release halfway through publishing; a following push queues.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read

  image:
    name: publish the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [release-please, ci]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing of the build provenance
      attestations: write
    env:
      IMAGE: ghcr.io/configbutler/krm-foyer
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: VERSION=v${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
