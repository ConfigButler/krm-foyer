# The validation pipeline: everything needed to trust a commit, and nothing that publishes.
#
# It runs directly on pull requests, and release.yml calls it as a reusable workflow on every
# push to main, so a release is only ever cut from a commit that passed this file. Permissions
# are read-only throughout, including on fork pull requests.
#
# Every check runs inside the CI image: the `ci` stage of .devcontainer/Dockerfile, the same
# image the devcontainer is built on. The first job builds it and hands it to the others as
# an artifact; .github/actions/in-ci-container runs a `task` target inside it. So nothing is
# installed on the runner, every tool comes from one Dockerfile at the versions in its ENV
# block, and a red job reproduces locally with the same command. This is how gitops-reverser
# runs its CI too. Unlike there, the image is never pushed: the release does not reuse it, so
# an artifact on every run is enough, and CI never needs a token that can write packages.
name: ci

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate; empty uses the event checkout
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the previous run. A release run has no pull request
# number, and github.run_id keeps its group unique so it can never be cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci-container:
    name: CI image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: build the ci stage of .devcontainer/Dockerfile
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          target: ci
          load: true
          push: false
          tags: krm-foyer-ci:local
          cache-from: type=gha,scope=ci-container
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=ci-container' || '' }}
      # A tool that fails to install should fail here, by name, not as a confusing error
      # halfway through some later job.
      - name: every tool the checks use is in the image
        run: |
          docker run --rm krm-foyer-ci:local bash -lc '
            set -e
            go version
            task --version
            golangci-lint version
            actionlint --version
            hadolint --version
            kubectl version --client
            k3d version
            docker --version
            openssl version
          '
      - name: save the image
        run: docker save krm-foyer-ci:local -o "$RUNNER_TEMP/ci-image.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-image
          path: ${{ runner.temp }}/ci-image.tar
          if-no-files-found: error
          retention-days: 1

  checks:
    name: lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci-container
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      # tidy-check, then go vet, golangci-lint, actionlint and hadolint, then go test -race.
      - uses: ./.github/actions/in-ci-container
        with:
          run: task tidy-check lint test

  image:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci-container
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      # Build the image, start it, and check that it answers. A Dockerfile that builds but
      # produces a binary that cannot start fails here.
      - uses: ./.github/actions/in-ci-container
        with:
          run: task image-smoke
          docker: "true"

  e2e:
    name: e2e (k3d + Dex)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci-container
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      # The CI image joins the fixture's Docker network exactly as the devcontainer does,
      # so the fixture is reached the same way in both. -v lists every spec, including
      # the pending ones.
      - uses: ./.github/actions/in-ci-container
        with:
          run: task test-e2e -- -v -ginkgo.v
          docker: "true"
      - name: API server log on failure
        if: failure()
        run: docker logs k3d-krm-foyer-e2e-server-0 2>&1 | tail -200

  devcontainer:
    name: devcontainer builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # A devcontainer that no longer builds is found by the next contributor, on their
      # first day. Build it here instead. Nothing is pushed.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          target: dev
          push: false
          # dev builds on the ci stage, so the CI image's layers are reused here.
          cache-from: |
            type=gha,scope=ci-container
            type=gha,scope=devcontainer
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=devcontainer' || '' }}
