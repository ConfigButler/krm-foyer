# What the hello example needs in the cluster: a Note resource, a namespace with two
# notes in it, and grants for the fixture's two Dex users. alice may edit notes; bob may
# only read them, so his edits are refused by Kubernetes with 403. krm-foyer has no part
# in that decision: these grants are the whole of it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: notes.hello.krm-foyer.example
spec:
  group: hello.krm-foyer.example
  names:
    kind: Note
    listKind: NoteList
    plural: notes
    singular: note
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 280
      additionalPrinterColumns:
        - name: Text
          type: string
          jsonPath: .spec.text
---
apiVersion: v1
kind: Namespace
metadata:
  name: hello
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: note-editor
  namespace: hello
rules:
  - apiGroups: [hello.krm-foyer.example]
    resources: [notes]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: note-reader
  namespace: hello
rules:
  - apiGroups: [hello.krm-foyer.example]
    resources: [notes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alice-edits-notes
  namespace: hello
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: note-editor
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: oidc:alice@example.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bob-reads-notes
  namespace: hello
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: note-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: oidc:bob@example.com
