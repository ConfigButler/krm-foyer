# The front door: what a browser reaches as https://foyer.localhost:8443, through
# kubectl port-forward (port-forward.sh). It runs in the cluster (front-door.yaml).
#
# It is the ingress of docs/ingress.md in its smallest form: one origin, the application
# at /, and krm-foyer's prefixes sent to krm-foyer's Service.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {}

http {
  access_log /dev/stdout;
  # Writable paths for an unprivileged nginx: /tmp is an emptyDir.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  include /etc/nginx/mime.types;
  server_tokens off;
  # A Kubernetes object can be larger than nginx's 1 MiB default.
  client_max_body_size 4m;

  server {
    listen 8443 ssl;
    ssl_certificate /etc/front-door/tls/tls.crt;
    ssl_certificate_key /etc/front-door/tls/tls.key;

    # krm-foyer's prefixes. Matching uses nginx's cleaned path, but proxy_pass without a
    # path sends the request line exactly as the browser wrote it, so a disguised path
    # still reaches krm-foyer in its raw form and is refused there.
    location ~ ^/(auth|k8s|stream|_foyer)(/|$) {
      proxy_pass https://krm-foyer.krm-foyer.svc.cluster.local;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /etc/front-door/ca/ca.crt;
      proxy_ssl_name foyer.localhost;
      proxy_ssl_server_name on;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      # Watches stream: nothing is held back, in either direction.
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 1h;
    }

    # The application: static files and nothing else. Its policy allows scripts from this
    # origin only, so injected markup cannot run, and nothing can frame it.
    location / {
      root /etc/front-door/web;
      add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Cache-Control no-cache always;
    }
  }
}
