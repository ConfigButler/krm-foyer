# The test application on room.localhost (routes.yaml): the application's side of Room
# Pass's QR join, and a page to come back to. Nothing in it is krm-foyer's.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {}

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;
  absolute_redirect off;

  server {
    listen 8443 ssl;
    ssl_certificate /etc/room-app/tls/tls.crt;
    ssl_certificate_key /etc/room-app/tls/tls.key;
    ssl_protocols TLSv1.3;

    # A tripwire, as in hello-web: no cookie of krm-foyer's or Room Pass's gets here.
    if ($http_cookie) {
      return 400;
    }

    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;

    # GET /join-room?code=K7Q2: what the QR code on the presenter's screen points at.
    # Room Pass's cookie contract (its docs/qr-join.md): the code, bounded to what Room
    # Pass accepts, in __Host-room-pass-joincode, Secure, HttpOnly, Path=/ and
    # SameSite=Lax (Strict would not survive the redirects through the issuer's host),
    # for five minutes. Then the application's own login: krm-foyer's, with Room Pass's
    # connector and a destination fixed here, never taken from the request. The code
    # goes nowhere else: not into the login link, and not into a log, since it is a
    # credential while it is valid.
    location = /join-room {
      access_log off;
      add_header Referrer-Policy no-referrer always;
      add_header Cache-Control no-store always;
      if ($arg_code !~ "^[A-Z0-9]{1,12}$") {
        return 400 "not a room code\n";
      }
      add_header Set-Cookie "__Host-room-pass-joincode=$arg_code; Path=/; Max-Age=300; Secure; HttpOnly; SameSite=Lax" always;
      return 302 "/auth/login?return_to=%2Froom%2F&oidc.connector_id=room-pass";
    }

    # Where a participant arrives, signed in.
    location = /room/ {
      default_type text/html;
      return 200 '<!doctype html><title>The room</title><p>You are in the room.</p>';
    }

    location / {
      return 404;
    }
  }
}
