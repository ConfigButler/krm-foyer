# The hello example's files, served as they are. Routing is not done here: the Gateway
# (gateway.yaml) sends / to this server and krm-foyer's prefixes to krm-foyer.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {}

http {
  access_log /dev/stdout;
  # Writable paths for an unprivileged nginx: /tmp is an emptyDir.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  include /etc/nginx/mime.types;
  server_tokens off;

  # Plain HTTP inside the cluster: the Gateway terminates TLS. These are public files; the
  # session cookie and the user's requests go to krm-foyer, over TLS (BackendTLSPolicy).
  server {
    listen 8080;
    root /etc/hello-web/files;

    # The application's policy: scripts from this origin only, so injected markup cannot
    # run, and nothing can frame it.
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-cache always;
  }
}
