# The hello example's files, served as they are. Routing is not done here: the Gateway
# (gateway.yaml) sends / to this server and krm-foyer's prefixes to krm-foyer.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {}

http {
  access_log /dev/stdout;
  # Writable paths for an unprivileged nginx: /tmp is an emptyDir.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  include /etc/nginx/mime.types;
  server_tokens off;

  # TLS, which the Gateway verifies (gateway.yaml). The files are public, but every
  # script served on this origin acts as the signed-in user, so what crosses this hop
  # must arrive as sent. The Gateway removes the session cookie on the way here.
  server {
    listen 8443 ssl;
    ssl_certificate /etc/hello-web/tls/tls.crt;
    ssl_certificate_key /etc/hello-web/tls/tls.key;
    ssl_protocols TLSv1.3;
    root /etc/hello-web/files;

    # A tripwire, not a defense: the session cookie must not get this far. Every browser
    # spec loads its pages signed in, so they all fail if the Gateway stops removing it.
    if ($http_cookie) {
      return 400;
    }

    # The application's policy: scripts from this origin only, so injected markup cannot
    # run, and nothing can frame it.
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-cache always;
  }
}
