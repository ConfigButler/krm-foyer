# The nginx recipe of docs/ingress.md, run: nginx in front of krm-foyer under the same
# public name, foyer.localhost, which the suite reaches on a NodePort (FOYER_NGINX_ADDR in
# foyer-env). front-door.sh copies the recipe's own blocks out of docs/ingress.md into
# recipe.conf and foyer.js, so what runs here is what the document says, byte for byte.
# Only what the recipe leaves to the deployment is written here: TLS, krm-foyer's own
# prefixes, and the two backends it names.

# The recipe encodes the return path with njs, which the official nginx images include.
load_module modules/ngx_http_js_module.so;

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {}

http {
  access_log /dev/stdout;
  # Writable paths for an unprivileged nginx: /tmp is an emptyDir.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;

  server {
    listen 8443 ssl;
    server_name foyer.localhost;
    # The front door's certificate (front-door.sh): the same public name as krm-foyer.
    ssl_certificate /etc/nginx-door/tls/tls.crt;
    ssl_certificate_key /etc/nginx-door/tls/tls.key;
    ssl_protocols TLSv1.3;

    # krm-foyer's own prefixes, ungated, to its Service over verified TLS. With no URI
    # in proxy_pass, nginx passes the request target as the browser sent it.
    location /auth/ {
      proxy_pass https://krm-foyer.krm-foyer.svc;
      include /etc/nginx-door/foyer-upstream.conf;
    }
    location /k8s/ {
      proxy_pass https://krm-foyer.krm-foyer.svc;
      include /etc/nginx-door/foyer-upstream.conf;
    }
    location /stream/ {
      proxy_pass https://krm-foyer.krm-foyer.svc;
      include /etc/nginx-door/foyer-upstream.conf;
    }
    location /_foyer/ {
      proxy_pass https://krm-foyer.krm-foyer.svc;
      include /etc/nginx-door/foyer-upstream.conf;
    }

    # docs/ingress.md's nginx recipe, copied from the document by front-door.sh.
    include /etc/nginx/recipe.conf;

    location / {
      return 404;
    }
  }

  # The recipe's two backends, voter-backend and voter-web: the pod's hostAliases send
  # both names here. Each answers with what it was sent, so a spec sees exactly what a
  # backend behind the recipe receives: the request target, and the identity header.
  server {
    listen 127.0.0.1:8080;
    default_type text/plain;

    # A tripwire, as in hello-web: the recipe removes the session cookie before this hop.
    if ($http_cookie) {
      return 400;
    }

    location /public/ {
      return 200 "identity=$http_krm_foyer_identity\nrequest=$request_uri\n";
    }
    location /admin/ {
      return 200 "request=$request_uri\n";
    }
  }
}
