# How nginx-door.conf reaches krm-foyer: verified TLS to its Service name, the browser's
# Host, and no buffering, so a stream's events pass as they come.
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/nginx/krm-foyer-ca.crt;
proxy_ssl_name krm-foyer.krm-foyer.svc;
proxy_ssl_server_name on;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_buffering off;
proxy_read_timeout 1h;
