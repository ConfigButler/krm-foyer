# Dex for the e2e fixture: the identity provider the API server trusts.
# Every static user's password is "password".
issuer: https://dex.localhost:5556
# Dex runs in the cluster (issuers.yaml) and keeps its state in custom resources there,
# its signing keys included. With memory storage a restarted pod signs with new keys,
# and the API server goes on refusing every token until it fetches them again (221
# seconds on k3s 1.36, measured).
storage:
  type: kubernetes
  config:
    inCluster: true
# For the same reason, no rotation while a fixture lives: each new key would mean
# minutes of refused logins.
expiry:
  signingKeys: 8760h
web:
  https: 0.0.0.0:5556
  tlsCert: /etc/dex/tls/tls.crt
  tlsKey: /etc/dex/tls/tls.key
oauth2:
  skipApprovalScreen: true
  # The password grant lets the suite obtain a user's token without a browser, so it
  # can ask the API server directly what that user may do and compare the answer
  # with what krm-foyer returns.
  passwordConnector: local
  grantTypes: [authorization_code, refresh_token, password]
enablePasswordDB: true
staticClients:
  - id: krm-foyer
    name: krm-foyer
    secret: krm-foyer-e2e-secret
    redirectURIs:
      - https://foyer.localhost:8443/auth/callback
  # The operator's command line, as kubectl's OIDC plugin would be: a client of its own,
  # so the API server can tell its tokens from krm-foyer's and map the same person to a
  # different username (authentication-config.yaml). docs/application-scope.md.
  - id: kubectl
    name: kubectl
    secret: kubectl-e2e-secret
    redirectURIs:
      - http://localhost:8000
  # A client the cluster does not accept tokens for. Its tokens are real Dex tokens
  # with the wrong audience.
  - id: other-app
    name: Some other application
    secret: other-app-e2e-secret
    redirectURIs:
      - https://other.krm-foyer.test/callback
# start-cluster.sh appends the rehearsal's
# users to this list (rehearsal-001@example.com and on), so it stays last.
staticPasswords:
  - email: alice@example.com
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: alice
    userID: 0f8e5c1a-alice
  - email: bob@example.com
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: bob
    userID: 3a1d9b7e-bob
