# The front door, in Gateway API: one origin, https://foyer.localhost:8443, with the
# hello example at / and krm-foyer's prefixes sent to krm-foyer. Traefik implements it
# (install-traefik.sh); a browser reaches Traefik through kubectl port-forward
# (port-forward.sh). This is the HTTPRoute recipe of docs/ingress.md, made real.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: front-door
  namespace: fixture
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      protocol: HTTPS
      # Traefik's websecure entrypoint (traefik-values.yaml).
      port: 8443
      hostname: foyer.localhost
      tls:
        mode: Terminate
        certificateRefs:
          # The same certificate as krm-foyer: one public name.
          - name: front-door-tls
      # Only the application's and krm-foyer's own routes may attach. Everything on this
      # origin acts as the signed-in user, so no other namespace gets a path on it.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [fixture, krm-foyer]
---
# The application: static files, everything krm-foyer does not claim. The browser sends
# the session cookie here too (it is Path=/), and a file server has no use for it, so it
# never leaves the Gateway on this route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
  namespace: fixture
spec:
  parentRefs:
    - name: front-door
  hostnames: [foyer.localhost]
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Cookie]
      backendRefs:
        - name: hello-web
          port: 443
---
# krm-foyer's prefixes. PathPrefix matches whole path segments: /k8s and /k8s/api, never
# /k8sfoo.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: krm-foyer
  namespace: krm-foyer
spec:
  parentRefs:
    - name: front-door
      namespace: fixture
  hostnames: [foyer.localhost]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /auth}
        - path: {type: PathPrefix, value: /k8s}
        - path: {type: PathPrefix, value: /stream}
        - path: {type: PathPrefix, value: /_foyer}
      backendRefs:
        - name: krm-foyer
          port: 443
---
# Traefik to krm-foyer is TLS too, verified: the session cookie and the user's requests
# cross it. The CA is the fixture's, from the ConfigMap deploy-foyer.sh creates.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: krm-foyer
  namespace: krm-foyer
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: krm-foyer
  validation:
    hostname: foyer.localhost
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: krm-foyer-issuer-ca
---
# Traefik to the file server is TLS too, verified. Its answers are scripts that run as
# the signed-in user, so this hop needs the same protection as the one to krm-foyer.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: hello-web
  namespace: fixture
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: hello-web
  validation:
    hostname: hello-web.fixture.svc
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: hello-web-ca
