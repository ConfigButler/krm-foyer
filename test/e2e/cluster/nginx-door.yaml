# The nginx recipe of docs/ingress.md, run (nginx-door.conf): nginx in front of the main
# krm-foyer, on a NodePort the suite reaches under krm-foyer's public name. front-door.sh
# fills in the image and the configuration hash, and creates the ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-door
  namespace: fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-door
  template:
    metadata:
      labels:
        app: nginx-door
      annotations:
        krm-foyer.test/config-hash: CONFIG_HASH
    spec:
      automountServiceAccountToken: false
      # The recipe's backends are this pod's second server (nginx-door.conf).
      hostAliases:
        - ip: 127.0.0.1
          hostnames: [voter-backend, voter-web]
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: NGINX_IMAGE
          command: [nginx, -c, /etc/nginx-door/nginx.conf, -g, "daemon off;"]
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx-door
              readOnly: true
            # The paths the recipe names.
            - name: config
              mountPath: /etc/nginx/recipe.conf
              subPath: recipe.conf
              readOnly: true
            - name: config
              mountPath: /etc/nginx/foyer.js
              subPath: foyer.js
              readOnly: true
            - name: config
              mountPath: /etc/nginx/krm-foyer-ca.crt
              subPath: ca.crt
              readOnly: true
            - name: tls
              mountPath: /etc/nginx-door/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: nginx-door
        - name: tls
          secret:
            secretName: front-door-tls
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-door
  namespace: fixture
spec:
  type: NodePort
  selector:
    app: nginx-door
  ports:
    - name: https
      port: 443
      targetPort: https
      nodePort: 30445
