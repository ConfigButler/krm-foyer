# The fixture's second issuer: two static JSON files over TLS. The suite holds the
# signing key, so it can mint tokens with claims Dex never issues (no email_verified,
# email_verified false, email_verified as a string) and check the API server refuses them.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {}

http {
  access_log /dev/stdout;
  default_type application/json;

  server {
    listen 8443 ssl;
    ssl_certificate /etc/krm-foyer-e2e/issuer-tls.crt;
    ssl_certificate_key /etc/krm-foyer-e2e/issuer-tls.key;

    location = /.well-known/openid-configuration {
      alias /etc/krm-foyer-e2e/issuer-discovery.json;
    }
    location = /jwks.json {
      alias /etc/krm-foyer-e2e/issuer-jwks.json;
    }
    location / {
      return 404;
    }
  }
}
