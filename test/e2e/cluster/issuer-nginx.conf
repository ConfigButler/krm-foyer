# The fixture's second issuer: two static JSON files over TLS. The suite holds the
# signing key, so it can mint tokens with claims Dex never issues (no email_verified,
# email_verified false, email_verified as a string) and check the API server refuses them.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {}

http {
  access_log /dev/stdout;
  # Writable paths for an unprivileged nginx: /tmp is an emptyDir.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  default_type application/json;

  server {
    listen 8443 ssl;
    ssl_certificate /etc/test-issuer/tls/tls.crt;
    ssl_certificate_key /etc/test-issuer/tls/tls.key;

    location = /.well-known/openid-configuration {
      alias /etc/test-issuer/files/discovery.json;
    }
    location = /jwks.json {
      alias /etc/test-issuer/files/jwks.json;
    }
    location / {
      return 404;
    }
  }
}
