{{- if .Values.serviceAccount.create }}
# The pod's own account. It is bound to nothing: krm-foyer never sends a request as it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "krm-foyer.serviceAccountName" . }}
  labels:
    {{- include "krm-foyer.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
